steps:
  - name: gcr.io/cloud-builders/npm
    dir: documed
    entrypoint: bash
    args: ["-c", "npm ci && npm run build"]

  - name: gcr.io/cloud-builders/docker
    dir: documed
    args: ["build", "-t", "gcr.io/$PROJECT_ID/documed:$COMMIT_SHA", "."]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "gcr.io/$PROJECT_ID/documed:$COMMIT_SHA"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - documed
      - --image=gcr.io/$PROJECT_ID/documed:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated

images:
  - gcr.io/$PROJECT_ID/documed:$COMMIT_SHA
